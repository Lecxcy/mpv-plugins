# ~/.config/mpv/input.conf
#
# ---------------------------------------------------------------------------
# 修饰键约定（改键位前先读完这一段）
# ---------------------------------------------------------------------------
#   无修饰   播放器通用操作 + enhanced_ab_loop 的高频操作
#   Ctrl+    微调，或"写入"（存档、保存模板槽位）
#   Shift+   反向 / 取消 / 强化
#   Alt+     split_zoom_box（分屏放大）专用
#   meta+    键盘上一律不用，只保留在鼠标组合里
#
# 关于 Shift：mpv 的 input.conf 对可打印字符（字母/数字/符号）不认
# "Shift+<基准键>" 这种组合写法，认的是 Shift 按下后实际产生的那个字符本身
# （mpv 的 input/input.c 没有把 Shift 修饰符和可打印字符分开处理，拿到的就
# 是产生的字符）。所以下面一律直接写 `{` `}` `<` `>` `|` 这些字符，不写
# "Shift+[" 之类。
#
# 关于 meta：mpv 从命令行启动、不是独立 .app，Cmd+1/Cmd+2 会被 mpv 自己的
# Cocoa 窗口菜单（"实际大小"/"双倍大小"）在比 input.conf 更底层的地方截走，
# 也没法用系统"App 快捷键"给这两个菜单项让路。踩过一次之后键盘上就不再依赖
# meta 了。meta+MBTN_LEFT 是唯一的例外——鼠标组合实测一直工作正常。
#
# 唯一违反"Alt 归 split_zoom_box"的是 Alt+1..9（删除 ab-loop 模板槽位）：
# split_zoom_box 不使用数字键，实际不会冲突，为它单独引入一个双修饰键组合
# 不划算。鼠标修饰键自成一套命名空间，同样不受这条 Alt 规则约束。
#
# 两个插件的"段"操作是同构的：动作键相同，用 Alt 区分作用域。
#
#   动作           enhanced_ab_loop      split_zoom_box
#   段起点/终点    [  ]                  Alt+[  Alt+]
#   列出所有段     \                     Alt+\
#   存档 / 读档    Ctrl+s  Ctrl+l        Alt+s  Alt+l
#   读档改名确认   y / n                 y / n（两个插件共用，见下）
# ---------------------------------------------------------------------------

# 全屏
ENTER cycle fullscreen
KP_ENTER cycle fullscreen

# 信息面板
i script-binding stats/display-stats-toggle

# 拖动/放大画面
# 平移：单窗格时等价于原 enhanced-drag（写 video-pan-*，无边界约束），
# 分屏后只平移鼠标所在的那个窗格
meta+MBTN_LEFT script-binding split_zoom_box/drag-pan
# 框选放大：单窗格时等价于原 drag-zoom-box（走 video-zoom），分屏后作用于
# 鼠标按下时所在的那个窗格
Ctrl+MBTN_LEFT script-binding split_zoom_box/drag-select

# 分屏放大（tmux 式递归二分）
# h/v 沿用 tmux `split-window -h/-v` 的方向定义：-h 切出左右两格、-v 切出
# 上下两格。这跟 vim `:vsplit`（切出左右）正好相反，容易记反，所以额外绑一
# 组"分隔线形状"别名：| 是竖线 -> 左右两格，- 是横线 -> 上下两格。两组等价。
Alt+h script-binding split_zoom_box/split-h
Alt+v script-binding split_zoom_box/split-v
Alt+| script-binding split_zoom_box/split-h
Alt+- script-binding split_zoom_box/split-v
# 关闭窗格，对齐 tmux 的 prefix+x
Alt+x script-binding split_zoom_box/close-pane
# 切换聚焦窗格，对齐 tmux 的 prefix+o
Alt+o script-binding split_zoom_box/focus-next
# 取消选中（播放时把橙色焦点框收起来）
Alt+ESC script-binding split_zoom_box/focus-clear
# 拖窗格之间的分隔条调整大小（只在指针压在分隔条上时才响应）。
# 用 Alt+ 而不是裸左键：mpv 的窗口拖拽在 macOS 上由系统层处理、早于 input
# 绑定，按住裸左键时鼠标位置不会上报给插件，分隔条会拖不动；裸左键还会
# 吞掉 uosc 进度条的点击。若想改回裸左键，需同时设 window-dragging=no。
Alt+MBTN_LEFT script-binding split_zoom_box/drag-divider
# 分屏时间段：起点/终点/删除当前所在段（与 ab-loop 的 [ ] 同构，加 Alt）
Alt+[ script-binding split_zoom_box/segment-start
Alt+] script-binding split_zoom_box/segment-end
Alt+BS script-binding split_zoom_box/segment-clear
Alt+【 script-binding split_zoom_box/segment-start
Alt+】 script-binding split_zoom_box/segment-end
# 把当前所在的段以播放位置为分割点切成前后两半（两半先继承同一份布局）
Alt+d script-binding split_zoom_box/segment-divide
# 列出所有分屏段（\ 已被 enhanced_ab_loop 的 show-state 占用）
Alt+\ script-binding split_zoom_box/show-state
Alt+、 script-binding split_zoom_box/show-state
# 把当前所在的 ab-loop 区间原样建成一个分屏段
Alt+a script-binding split_zoom_box/segment-from-abloop
# 存档/读档
Alt+s script-binding split_zoom_box/save-layouts
Alt+l script-binding split_zoom_box/load-layouts

# 以鼠标位置为中心缩放；同时重置拖拽产生的 video-pan-x/y，缩放和拖拽是一体的状态
# 0 没有跟着挪去 Alt+0：它是高频操作，而且"归零"这个助记太好。1..9 归模板
# 槽位、0 归重置，两者不冲突。（覆盖掉 mpv 内置的 `add volume 2`。）
0 no-osd set video-zoom 0 ; no-osd set video-pan-x 0 ; no-osd set video-pan-y 0
KP0 no-osd set video-zoom 0 ; no-osd set video-pan-x 0 ; no-osd set video-pan-y 0
# 滚轮缩放：分屏时只缩放鼠标所在的窗格（鼠标不在窗格内则用选中的窗格）
WHEEL_UP script-binding split_zoom_box/zoom-in
WHEEL_DOWN script-binding split_zoom_box/zoom-out

# 旋转
r script-message-to enhanced_rotation rotate-video 90
R script-message-to enhanced_rotation rotate-video -90
Ctrl+r script-message-to enhanced_rotation rotate-video-reset

# 音量
UP    script-binding enhanced_volume/volume-up
DOWN  script-binding enhanced_volume/volume-down

# 快进
RIGHT script-binding enhanced_seek/seek-forward
LEFT  script-binding enhanced_seek/seek-backward

# 速度
c multiply speed 1.1
x multiply speed 1/1.1

# 设置 A / B
[ script-binding enhanced_ab_loop/set-a
] script-binding enhanced_ab_loop/set-b
{ script-binding enhanced_ab_loop/unset-a
} script-binding enhanced_ab_loop/unset-b
\ script-binding enhanced_ab_loop/show-state
、 script-binding enhanced_ab_loop/show-state
| script-binding enhanced_ab_loop/toggle-enabled

【 script-binding enhanced_ab_loop/set-a
】 script-binding enhanced_ab_loop/set-b
「 script-binding enhanced_ab_loop/unset-a
」 script-binding enhanced_ab_loop/unset-b

# 微调：Ctrl=微调，[ / ] 选左端还是右端，Shift（-> { / }）= 反向。
# 默认方向统一是"把区间撑大"，Shift 反过来是"把区间收紧"——微调时脑子里想
# 的是"这段再长一点/短一点"，不是"A 往左还是往右"，按端点+方向去记比原来
# 的"修饰键决定方向"好记得多。
#
# 注意 Ctrl+] 的行为跟改版前是反的：以前是 nudge-b-back，现在是
# nudge-b-forward。
Ctrl+[ script-binding enhanced_ab_loop/nudge-a-back
Ctrl+] script-binding enhanced_ab_loop/nudge-b-forward
Ctrl+{ script-binding enhanced_ab_loop/nudge-a-forward
Ctrl+} script-binding enhanced_ab_loop/nudge-b-back

Ctrl+【 script-binding enhanced_ab_loop/nudge-a-back
Ctrl+】 script-binding enhanced_ab_loop/nudge-b-forward
Ctrl+「 script-binding enhanced_ab_loop/nudge-a-forward
Ctrl+」 script-binding enhanced_ab_loop/nudge-b-back

# 拉伸相邻区间边界（SPEC §3.2，光标要落在空隙里，不能在任何区间内部）。
# 覆盖掉 mpv 内置的 playlist-prev/next。
#
# 尖括号按"边界往哪个方向跑"来记，不是按"拉伸哪一段"：
#   `<` -> extend-next：右侧那段的**起点左移**到光标，那段往左长
#   `>` -> extend-prev：左侧那段的**终点右移**到光标，那段往右长
# 所以键名和 binding 名看起来是反的（`<` 配 next）。binding 名说的是"拉伸
# 哪一段"，按键符号说的是"边界朝哪走"，这两件事天然相反——一段要往左长，
# 它必然是右边那一段。按符号记的好处是它同时对上了屏幕上实际看到的运动
# 方向和那一段的生长方向，按 binding 名记则要在脑子里多绕一次。
< script-binding enhanced_ab_loop/extend-next
> script-binding enhanced_ab_loop/extend-prev
《 script-binding enhanced_ab_loop/extend-next
》 script-binding enhanced_ab_loop/extend-prev

# 启用/禁用光标所在区间参与循环（SPEC §5）
t script-binding enhanced_ab_loop/toggle-segment

# solo：只启用光标所在区间，其余全部禁用（SPEC §5）
T script-binding enhanced_ab_loop/solo-segment

# 存档 / 读档（SPEC §6）
Ctrl+s script-binding enhanced_ab_loop/save-loops
Ctrl+l script-binding enhanced_ab_loop/load-loops

# 读档时如果命中"内容相同但路径不同"的唯一候选，会弹出 OSD 提示，按这两个
# 键确认/取消（没有待确认项时按了没有任何效果）。
#
# 两个插件共用同一对物理键：确认是模态操作，同一时刻只可能有一个插件在等，
# 没必要各占一套。同一个 section 里一个键只能有一条绑定（写成两行的话后写
# 的会把先写的整条覆盖掉，实测确认过），所以只能用 `;` 串接成一条命令同时
# 喂给两边；没在等确认的那个插件收到后直接空转。
#
# 插件反查"哪个物理键绑到了自己的 confirm-yes/no"（用来在确认期间启用独占
# 按键区段、把其余按键全部吃掉）时，从 input-bindings 属性读到的 cmd 就是
# 下面这一整行串接命令，所以 shared/cpp/confirm_lockout.h 是按 `;` 拆开后
# 逐条比对的，不能改回整串全等——改回去会让锁键静默失效。
y script-binding enhanced_ab_loop/confirm-yes ; script-binding split_zoom_box/confirm-yes
n script-binding enhanced_ab_loop/confirm-no ; script-binding split_zoom_box/confirm-no

# 循环开着时，不想看完当前这段了，立刻跳到下一个启用的段
Tab script-binding enhanced_ab_loop/skip-next

# 模板：9 个编号槽位，每个槽位是一份独立的 (segments, pending) 快照。
# 裸数字=应用（最高频，配最便宜的键）；Ctrl=保存当前状态到槽位（沿用
# Ctrl+s/Ctrl+l 里 Ctrl=写入的语义）；Alt=删除槽位。
#
# 应用原本是 meta+数字，被 Cocoa 窗口菜单截走（见文件开头关于 meta 的说明）；
# 改成的 Shift+1..9 也退役了：mpv 认的是 Shift 按下后产生的字符，US 布局下
# 是 !@#$%^&*(，换个键盘布局整组就废；其中 `#` 还得用按键别名 SHARP 才能绕
# 开 input.conf "以 # 开头的整行当注释"的解析。裸数字键没有这些问题。
#
# 代价是覆盖掉 mpv 内置的画质微调：1/2 对比度、3/4 亮度、5/6 gamma、
# 7/8 饱和度，以及 9 的音量 -2。
1 script-binding enhanced_ab_loop/template-apply-1
2 script-binding enhanced_ab_loop/template-apply-2
3 script-binding enhanced_ab_loop/template-apply-3
4 script-binding enhanced_ab_loop/template-apply-4
5 script-binding enhanced_ab_loop/template-apply-5
6 script-binding enhanced_ab_loop/template-apply-6
7 script-binding enhanced_ab_loop/template-apply-7
8 script-binding enhanced_ab_loop/template-apply-8
9 script-binding enhanced_ab_loop/template-apply-9

Ctrl+1 script-binding enhanced_ab_loop/template-save-1
Ctrl+2 script-binding enhanced_ab_loop/template-save-2
Ctrl+3 script-binding enhanced_ab_loop/template-save-3
Ctrl+4 script-binding enhanced_ab_loop/template-save-4
Ctrl+5 script-binding enhanced_ab_loop/template-save-5
Ctrl+6 script-binding enhanced_ab_loop/template-save-6
Ctrl+7 script-binding enhanced_ab_loop/template-save-7
Ctrl+8 script-binding enhanced_ab_loop/template-save-8
Ctrl+9 script-binding enhanced_ab_loop/template-save-9

Alt+1 script-binding enhanced_ab_loop/template-delete-1
Alt+2 script-binding enhanced_ab_loop/template-delete-2
Alt+3 script-binding enhanced_ab_loop/template-delete-3
Alt+4 script-binding enhanced_ab_loop/template-delete-4
Alt+5 script-binding enhanced_ab_loop/template-delete-5
Alt+6 script-binding enhanced_ab_loop/template-delete-6
Alt+7 script-binding enhanced_ab_loop/template-delete-7
Alt+8 script-binding enhanced_ab_loop/template-delete-8
Alt+9 script-binding enhanced_ab_loop/template-delete-9
